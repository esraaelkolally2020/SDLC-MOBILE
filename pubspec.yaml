name: starter_app
description: "Flutter starter template (Clean Architecture + Cubit + get_it + go_router)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  collection: ^1.19.1
  dio: ^5.10.0
  get_it: ^8.0.3
  easy_localization: ^3.0.8
  sizer: ^3.0.3
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^10.3.0
  go_router: ^16.2.2
  url_launcher: ^6.3.0
  equatable: ^2.0.8
  flutter_bloc: ^9.1.1
  flutter_spinkit: ^5.2.1
  cached_network_image: ^4.0.0
  flutter_svg: ^2.0.14
  connectivity_plus: ^7.0.0
  skeletonizer: ^2.1.0+1
  path: ^1.8.3
  open_filex: ^4.7.0
  path_provider: ^2.1.5
  web: ^1.1.0
  http_certificate_pinning: ^3.0.2
  sentry_flutter: ^9.30.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
    - assets/images/png/
    - assets/images/svg/
